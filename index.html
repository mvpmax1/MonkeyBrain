<!DOCTYPE html>
<html>
<head>
    <title>Streak Betting Simulator - MVP Max</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.1.12/Recharts.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [params, setParams] = React.useState({
                days: 365,
                betsPerDay: 1,
                unitSize: 1,
                hitRate: 0.55,
            });
            
            const [simulationTrigger, setSimulationTrigger] = React.useState(0);

            const results = React.useMemo(() => {
                const results = [];
                const numSimulations = 1000;
                
                // We'll keep track of total picks and successes across ALL simulations
                let totalPicks = 0;
                let successfulPicks = 0;

                // 1) Generate a single random offset for the entire run
                //    Range: -0.5 to +0.5
                const luckFactor = Math.random() * 0.1 - 0.05; 
                // 2) Apply it to user’s chosen rate (params.hitRate)
                //    Then clamp to [0, 1]
                let adjustedHitRate = params.hitRate + luckFactor;
                adjustedHitRate = Math.min(1, Math.max(0, adjustedHitRate));

                // Now run all simulations using 'adjustedHitRate'
                for (let sim = 0; sim < numSimulations; sim++) {
                let bankroll = 0;
                let dailyResults = Array(params.days).fill(0);
                let streakProgress = 0;

                for (let day = 0; day < params.days; day++) {
                    for (let bet = 0; bet < params.betsPerDay; bet++) {
                    if (streakProgress === 0) {
                        const pick1Success = Math.random() < adjustedHitRate;
                        const pick2Success = Math.random() < adjustedHitRate;

                        totalPicks += 2;
                        successfulPicks += (pick1Success ? 1 : 0) + (pick2Success ? 1 : 0);

                        if (pick1Success && pick2Success) {
                        streakProgress = 2;
                        } else {
                        bankroll -= params.unitSize;
                        }
                    } else if (streakProgress < 11) {
                        const pickSuccess = Math.random() < adjustedHitRate;

                        totalPicks += 1;
                        successfulPicks += pickSuccess ? 1 : 0;

                        if (pickSuccess) {
                        streakProgress++;
                        if (streakProgress === 11) {
                            bankroll += params.unitSize * 1000;
                            streakProgress = 0;
                        }
                        } else {
                        bankroll -= params.unitSize;
                        streakProgress = 0;
                        }
                    }
                    }
                    dailyResults[day] = bankroll;
                }
                results.push(dailyResults);
                }

                // Once all simulations are done, figure out final stats
                const finalResults = results.map(path => path[path.length - 1]);
                finalResults.sort((a, b) => a - b);

                const unluckyIndex = Math.floor(numSimulations * 0.25);
                const medianIndex = Math.floor(numSimulations * 0.5);
                const luckyIndex = Math.floor(numSimulations * 0.75);

                const unluckyPath = results.find(path => path[path.length - 1] === finalResults[unluckyIndex]);
                const medianPath = results.find(path => path[path.length - 1] === finalResults[medianIndex]);
                const luckyPath = results.find(path => path[path.length - 1] === finalResults[luckyIndex]);

                const totalInvested = params.days * params.betsPerDay * params.unitSize;
                const actualHitRate = (successfulPicks / totalPicks) * 100;
                // difference = how far off our final rate is from the user’s base rate * 100
                const hitRateDiff = actualHitRate - (params.hitRate * 100);

                return {
                chartData: Array(params.days).fill(0).map((_, day) => ({
                    day: day + 1,
                    unlucky: unluckyPath[day],
                    median: medianPath[day],
                    lucky: luckyPath[day]
                })),
                roi: {
                    unlucky: ((finalResults[unluckyIndex] / totalInvested) * 100).toFixed(2),
                    median: ((finalResults[medianIndex] / totalInvested) * 100).toFixed(2),
                    lucky: ((finalResults[luckyIndex] / totalInvested) * 100).toFixed(2)
                },
                net: {
                    unlucky: finalResults[unluckyIndex].toFixed(2),
                    median: finalResults[medianIndex].toFixed(2),
                    lucky: finalResults[luckyIndex].toFixed(2)
                },
                hitRateStats: {
                    actual: actualHitRate.toFixed(1),
                    difference: hitRateDiff.toFixed(1)
                }
                };
            }, [params, simulationTrigger]);

            const handleSimulation = () => {
                setSimulationTrigger(prev => prev + 1);
            };

            const generateSensitivityData = React.useMemo(() => {
                const winRates = Array.from({ length: 46 }, (_, i) => (0.40 + i * 0.01));
                const results = [];

                winRates.forEach(rate => {
                    let totalReturn = 0;
                    const numSimulations = 1000;

                    for (let sim = 0; sim < numSimulations; sim++) {
                        let bankroll = 0;
                        let streakProgress = 0;
                        
                        for (let day = 0; day < 365; day++) {
                            if (streakProgress === 0) {
                                const pick1Success = Math.random() < rate;
                                const pick2Success = Math.random() < rate;
                                
                                if (pick1Success && pick2Success) {
                                    streakProgress = 2;
                                } else {
                                    bankroll -= 1;
                                }
                            }
                            else if (streakProgress < 11) {
                                const pickSuccess = Math.random() < rate;
                                if (pickSuccess) {
                                    streakProgress++;
                                    if (streakProgress === 11) {
                                        bankroll += 1000;
                                        streakProgress = 0;
                                    }
                                } else {
                                    bankroll -= 1;
                                    streakProgress = 0;
                                }
                            }
                        }
                        totalReturn += bankroll;
                    }

                    const averageReturn = totalReturn / numSimulations;
                    const roi = (averageReturn / 365) * 100;

                    results.push({
                        winRate: (rate * 100).toFixed(0),
                        roi: roi.toFixed(2),
                        return: averageReturn.toFixed(2)
                    });
                });

                return results;
            }, []);

            return (
                <div className="container mx-auto px-4 py-8 max-w-5xl">
                    <div className="bg-white rounded-lg shadow-lg p-6 space-y-8">
                        <div>
                            <h1 className="text-3xl font-bold text-center">Streak Betting Simulator - MVP Max</h1>
                            <p className="text-gray-600 text-center mt-2">
                                Simulates betting with 11-pick streaks (2 initial + 9 consecutive picks). 
                                Each streak must be completed consecutively.
                            </p>
                        </div>
                        
                        <div className="space-y-4">
                            <h2 className="text-xl font-semibold">Simulation Parameters</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium mb-1">Days to Simulate</label>
                                    <input
                                        type="number"
                                        value={params.days}
                                        onChange={(e) => setParams(p => ({...p, days: parseInt(e.target.value)}))}
                                        className="w-full p-2 border rounded"
                                        min="1"
                                        max="3650"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Bets Per Day</label>
                                    <input
                                        type="number"
                                        value={params.betsPerDay}
                                        onChange={(e) => setParams(p => ({...p, betsPerDay: parseInt(e.target.value)}))}
                                        className="w-full p-2 border rounded"
                                        min="1"
                                        max="100"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Unit Size ($1-$10)</label>
                                    <input
                                        type="number"
                                        value={params.unitSize}
                                        onChange={(e) => setParams(p => ({...p, unitSize: Math.min(10, Math.max(1, parseInt(e.target.value)))}))}
                                        className="w-full p-2 border rounded"
                                        min="1"
                                        max="10"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Pick Success Rate (0-1)</label>
                                    <input
                                        type="number"
                                        value={params.hitRate}
                                        onChange={(e) => setParams(p => ({...p, hitRate: parseFloat(e.target.value)}))}
                                        className="w-full p-2 border rounded"
                                        min="0"
                                        max="1"
                                        step="0.01"
                                    />
                                </div>
                            </div>
                            <div className="flex justify-center mt-4">
                                <button 
                                    onClick={handleSimulation}
                                    className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded"
                                >
                                    Run Simulation
                                </button>
                            </div>
                        </div>

                        <div className="bg-gray-50 p-4 rounded-lg">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-semibold">Return on Investment</h2>
                                <div className="text-sm text-gray-600">
                                    Actual Hit Rate: {results.hitRateStats.actual}% 
                                    <span className="ml-1">
                                        ({results.hitRateStats.difference > 0 ? '+' : ''}{results.hitRateStats.difference}% due to luck)
                                    </span>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-4">
                                <div>
                                    <div className="text-sm text-gray-600">Unlucky (25th)</div>
                                    <div className="text-lg font-semibold text-red-600">{results.roi.unlucky}%</div>
                                    <div className="text-sm text-gray-600">${results.net.unlucky}</div>
                                </div>
                                <div>
                                    <div className="text-sm text-gray-600">Median (50th)</div>
                                    <div className="text-lg font-semibold">{results.roi.median}%</div>
                                    <div className="text-sm text-gray-600">${results.net.median}</div>
                                </div>
                                <div>
                                    <div className="text-sm text-gray-600">Lucky (75th)</div>
                                    <div className="text-lg font-semibold text-green-600">{results.roi.lucky}%</div>
                                    <div className="text-sm text-gray-600">${results.net.lucky}</div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h2 className="text-xl font-semibold mb-4">Bankroll Over Time</h2>
                            <div className="overflow-x-auto flex justify-center">
                                <Recharts.LineChart 
                                    width={800} 
                                    height={400} 
                                    data={results.chartData}
                                >
                                    <Recharts.CartesianGrid strokeDasharray="3 3" />
                                    <Recharts.XAxis dataKey="day" />
                                    <Recharts.YAxis />
                                    <Recharts.Tooltip formatter={(value) => `$${value.toFixed(2)}`} />
                                    <Recharts.Legend />
                                    <Recharts.Line 
                                        type="monotone" 
                                        dataKey="unlucky" 
                                        stroke="#ef4444" 
                                        name="Unlucky (25th percentile)" 
                                    />
                                    <Recharts.Line 
                                        type="monotone" 
                                        dataKey="median" 
                                        stroke="#3b82f6" 
                                        name="Median (50th percentile)" 
                                    />
                                    <Recharts.Line 
                                        type="monotone" 
                                        dataKey="lucky" 
                                        stroke="#22c55e" 
                                        name="Lucky (75th percentile)" 
                                    />
                                </Recharts.LineChart>
                            </div>
                        </div>
                    </div>

                    {/* Sensitivity Analysis */}
                    <div className="bg-white rounded-lg shadow-lg p-6 mt-8">
                        <h2 className="text-xl font-semibold mb-4">Win Rate Sensitivity Analysis</h2>
                        <p className="text-gray-600 mb-4">
                            Average return over 365 days with 1 bet per day at different win rates
                        </p>
                        <div className="overflow-x-auto flex justify-center">
                            <Recharts.LineChart 
                                width={800} 
                                height={400} 
                                data={generateSensitivityData}
                                margin={{ top: 5, right: 30, left: 20, bottom: 5 }}
                            >
                                <Recharts.CartesianGrid strokeDasharray="3 3" />
                                <Recharts.XAxis 
                                    dataKey="winRate" 
                                    label={{ value: 'Win Rate (%)', position: 'bottom', offset: 0 }}
                                />
                                <Recharts.YAxis 
                                    label={{ 
                                        value: 'ROI (%)', 
                                        angle: -90, 
                                        position: 'insideLeft',
                                        offset: 10
                                    }}
                                    domain={[-100, 3600]}
                                    allowDataOverflow={true}
                                />
                                <Recharts.Tooltip 
                                    formatter={(value, name) => [
                                        `${parseFloat(value).toFixed(2)}%`, 
                                        'ROI'
                                    ]}
                                    labelFormatter={(label) => `Win Rate: ${label}%`}
                                />
                                <Recharts.Line 
                                    type="monotone" 
                                    dataKey="roi" 
                                    stroke="#3b82f6" 
                                    dot={false}
                                    name="ROI" 
                                />
                                <Recharts.ReferenceLine 
                                    y={0} 
                                    stroke="#666" 
                                    strokeDasharray="3 3"
                                />
                            </Recharts.LineChart>
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
